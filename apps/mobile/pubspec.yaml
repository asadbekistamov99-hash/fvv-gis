name: fvv_gis_uzbekistan
description: Independent role-aware GIS platform for Uzbekistan. Not a government application.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.3
  sqlite3: ^3.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  maplibre_gl: ^0.28.0
  geolocator: ^14.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  file_picker: ^13.3.2
  uuid: ^4.5.3
  crypto: ^3.0.7
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
